<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер чтения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .book-card { transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-book-reader"></i> Трекер чтения
            </a>
            <div class="navbar-nav ms-auto">
                <div id="auth-buttons">
                    <button class="btn btn-outline-light me-2" id="login-btn">Войти</button>
                    <button class="btn btn-primary" id="register-btn">Регистрация</button>
                </div>
                <div id="user-menu" style="display: none;">
                    <span class="navbar-text me-3" id="username"></span>
                    <button class="btn btn-outline-light" id="logout-btn">Выйти</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alert-container"></div>
        <div id="app-content">
            <div class="text-center mt-5">
                <h2>Добро пожаловать в трекер чтения!</h2>
                <p class="lead">Начните отслеживать свои книги прямо сейчас.</p>
                <button class="btn btn-primary btn-lg me-2" id="start-now-btn">Начать сейчас</button>
                <button class="btn btn-outline-secondary btn-lg" id="register-main-btn">Регистрация</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Вход в систему</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Регистрация</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addBookModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить книгу</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-book-form">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Название книги *</label>
                                    <input type="text" class="form-control" name="title" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Автор *</label>
                                    <input type="text" class="form-control" name="author" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Жанр</label>
                                    <select class="form-select" name="genre">
                                        <option value="fiction">Художественная литература</option>
                                        <option value="non_fiction">Нехудожественная литература</option>
                                        <option value="fantasy">Фэнтези</option>
                                        <option value="sci_fi">Научная фантастика</option>
                                        <option value="mystery">Детектив</option>
                                        <option value="romance">Роман</option>
                                        <option value="biography">Биография</option>
                                        <option value="history">История</option>
                                        <option value="science">Наука</option>
                                        <option value="other">Другое</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Год издания</label>
                                    <input type="number" class="form-control" name="publication_year">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea class="form-control" name="description" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Статус</label>
                                    <select class="form-select" name="status">
                                        <option value="want_to_read">Хочу прочитать</option>
                                        <option value="reading">Читаю</option>
                                        <option value="finished">Прочитано</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Оценка (1-5)</label>
                                    <select class="form-select" name="rating">
                                        <option value="">Без оценки</option>
                                        <option value="1">1 ★</option>
                                        <option value="2">2 ★★</option>
                                        <option value="3">3 ★★★</option>
                                        <option value="4">4 ★★★★</option>
                                        <option value="5">5 ★★★★★</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Отзыв</label>
                            <textarea class="form-control" name="review" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Добавить книгу</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('login-btn').addEventListener('click', showLogin);
        document.getElementById('register-btn').addEventListener('click', showRegister);
        document.getElementById('start-now-btn').addEventListener('click', showLogin);
        document.getElementById('register-main-btn').addEventListener('click', showRegister);
        
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        document.getElementById('register-form').addEventListener('submit', handleRegister);
        document.getElementById('add-book-form').addEventListener('submit', handleAddBook);
    });

    function showLogin() {
        const modal = new bootstrap.Modal(document.getElementById('loginModal'));
        modal.show();
    }

    function showRegister() {
        const modal = new bootstrap.Modal(document.getElementById('registerModal'));
        modal.show();
    }

    function showAddBookModal() {
        const modal = new bootstrap.Modal(document.getElementById('addBookModal'));
        modal.show();
    }

    function showAlert(message, type = 'info') {
        const container = document.getElementById('alert-container');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type} alert-dismissible fade show`;
        alert.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        container.appendChild(alert);
        setTimeout(() => alert.remove(), 5000);
    }

    async function handleLogin(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        
        try {
            const response = await fetch('/api/auth/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken(),
                },
                body: JSON.stringify({
                    username: formData.get('username'),
                    password: formData.get('password')
                })
            });

            if (response.ok) {
                const data = await response.json();
                showAlert('Успешный вход!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
                location.reload();
            } else {
                showAlert('Ошибка входа', 'danger');
            }
        } catch (error) {
            showAlert('Ошибка сети', 'danger');
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        
        try {
            const response = await fetch('/api/auth/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken(),
                },
                body: JSON.stringify({
                    username: formData.get('username'),
                    email: formData.get('email'),
                    password: formData.get('password')
                })
            });

            if (response.ok) {
                showAlert('Регистрация успешна! Войдите в систему.', 'success');
                bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
                setTimeout(showLogin, 1000);
            } else {
                const error = await response.json();
                showAlert(error.error || 'Ошибка регистрации', 'danger');
            }
        } catch (error) {
            showAlert('Ошибка сети', 'danger');
        }
    }

    async function handleAddBook(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        
        const bookData = {
            title: formData.get('title'),
            author: formData.get('author'),
            genre: formData.get('genre'),
            publication_year: formData.get('publication_year') || null,
            description: formData.get('description')
        };

        const readingEntryData = {
            status: formData.get('status'),
            rating: formData.get('rating') || null,
            review: formData.get('review')
        };

        try {
            const bookResponse = await fetch('/api/books/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken(),
                },
                body: JSON.stringify(bookData)
            });

            if (bookResponse.ok) {
                const book = await bookResponse.json();
                
                const entryResponse = await fetch('/api/reading-entries/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCSRFToken(),
                    },
                    body: JSON.stringify({
                        book: book.id,
                        ...readingEntryData
                    })
                });

                if (entryResponse.ok) {
                    showAlert('Книга добавлена!', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addBookModal')).hide();
                    e.target.reset();
                }
            }
        } catch (error) {
            showAlert('Ошибка при добавлении книги', 'danger');
        }
    }

    function getCSRFToken() {
        const cookieValue = document.cookie
            .split('; ')
            .find(row => row.startsWith('csrftoken='))
            ?.split('=')[1];
        return cookieValue || '';
    }

    async function checkAuth() {
        try {
            const response = await fetch('/api/users/current_user/', {
                credentials: 'include'
            });
            
            if (response.ok) {
                const user = await response.json();
                document.getElementById('auth-buttons').style.display = 'none';
                document.getElementById('user-menu').style.display = 'block';
                document.getElementById('username').textContent = user.username;
                document.getElementById('logout-btn').addEventListener('click', logout);
                
                showAuthenticatedContent();
            }
        } catch (error) {
            console.log('Пользователь не авторизован');
        }
    }

    async function logout() {
        try {
            await fetch('/api/auth/logout/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                }
            });
            location.reload();
        } catch (error) {
            console.error('Logout error:', error);
        }
    }

    async function showAuthenticatedContent() {
        try {
            const response = await fetch('/api/reading-entries/');
            if (response.ok) {
                const books = await response.json();
                displayBooks(books);
            }
        } catch (error) {
            console.error('Error loading books:', error);
        }
    }

    function displayBooks(books) {
        const content = document.getElementById('app-content');
        
        if (books.length === 0) {
            content.innerHTML = `
                <div class="text-center py-4">
                    <h3>Мои книги</h3>
                    <p class="text-muted">У вас пока нет книг</p>
                    <button class="btn btn-primary" onclick="showAddBookModal()">
                        <i class="fas fa-plus"></i> Добавить книгу
                    </button>
                </div>
            `;
            return;
        }

        content.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Мои книги (${books.length})</h3>
                <button class="btn btn-primary" onclick="showAddBookModal()">
                    <i class="fas fa-plus"></i> Добавить книгу
                </button>
            </div>
            <div class="row">
                ${books.map(book => `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card book-card h-100">
                            <div class="card-body">
                                <h6 class="card-title">${book.book_details.title}</h6>
                                <p class="card-text text-muted">${book.book_details.author}</p>
                                <span class="badge ${getStatusBadgeClass(book.status)}">
                                    ${getStatusText(book.status)}
                                </span>
                                ${book.rating ? `
                                    <div class="mt-2 text-warning">
                                        ${'★'.repeat(book.rating)}${'☆'.repeat(5-book.rating)}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function getStatusBadgeClass(status) {
        const classes = {
            'want_to_read': 'bg-secondary',
            'reading': 'bg-warning',
            'finished': 'bg-success'
        };
        return classes[status] || 'bg-secondary';
    }

    function getStatusText(status) {
        const texts = {
            'want_to_read': 'Хочу прочитать',
            'reading': 'Читаю',
            'finished': 'Прочитано'
        };
        return texts[status] || status;
    }

    checkAuth();
    </script>
</body>
</html>
